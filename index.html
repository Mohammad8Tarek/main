    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;600;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontSize: {
              'xs': '0.85rem',
              'sm': '1rem',
              'base': '1.125rem',
              'lg': '1.25rem',
              'xl': '1.5rem',
              '2xl': '1.875rem',
              '3xl': '2.25rem',
            },
            fontFamily: {
              sans: ['Inter', 'Poppins', 'sans-serif'],
              arabic: ['Cairo', 'sans-serif'],
            },
            colors: {
              hotel: {
                navy: '#0F2A44',
                teal: '#0FB9B1',
                gold: '#C9A24D',
                bg: '#E2E8F0',
                text: '#2E2E2E',
                muted: '#5A6A85'
              },
              primary: {
                '50': '#F1F7FA',
                '100': '#E4EFF5',
                '200': '#C8DFEB',
                '300': '#ADD0E1',
                '400': '#75B1D2',
                '500': '#5294BF',
                '600': '#0F2A44',
                '700': '#0A1D30',
                '800': '#071523',
                '900': '#040D15',
                '950': '#02060A',
              },
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --primary-color: #0F2A44;
        --sidebar-color: #0F2A44;
        --button-color: #C9A24D;
        --header-color: #FFFFFF;
        --bg-color: #E2E8F0;
        --text-color: #1A202C;
      }
      
      .dark {
        /* توحيد لون البار العلوي والخلفية في الوضع الليلي */
        --header-color: #020617 !important; 
        --bg-color: #020617 !important;     
        --text-color: #f8fafc !important;   
        --sidebar-color: #0f172a !important;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Calendar Picker Icon Visibility Fix */
      input[type="date"]::-webkit-calendar-picker-indicator,
      input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        cursor: pointer;
        filter: invert(13%) sepia(35%) saturate(1637%) hue-rotate(185deg) brightness(92%) contrast(97%); /* Navy color for Light Mode */
      }

      .dark input[type="date"]::-webkit-calendar-picker-indicator,
      .dark input[type="datetime-local"]::-webkit-calendar-picker-indicator {
        filter: invert(100%) brightness(100%); /* White color for Dark Mode */
      }

      /* Scrollbar Styling */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg-color); }
      ::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 10px; }
      .dark ::-webkit-scrollbar-track { background: #020617; }
      .dark ::-webkit-scrollbar-thumb { background: #1e293b; }
    </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  }
}
</script>
